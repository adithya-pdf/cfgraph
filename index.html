<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#f4f6fb" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Interactive Codeforces rating and problem-solving dashboard running entirely in the browser."
    />
    <title>CF Graph — browser edition</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css"
    />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #f4f6fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      #root {
        width: 100%;
        height: 100vh;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f4f6fb;
        z-index: 0;
        pointer-events: none;
      }

      #boot-card {
        text-align: center;
        color: #64748b;
        font-size: 0.9rem;
        max-width: 34rem;
        padding: 1.5rem;
      }

      #boot-card strong {
        display: block;
        color: #0f172a;
        font-size: 1.2rem;
        letter-spacing: -0.03em;
        margin-bottom: 0.45rem;
      }

      .boot-dot {
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #0000ff;
        display: inline-block;
        margin-right: 0.42rem;
        vertical-align: middle;
      }

      #boot-card code {
        color: #9a3412;
        font-size: 0.78rem;
      }
    </style>
  </head>

  <body>
    <div id="boot">
      <div id="boot-card">
        <strong><span class="boot-dot"></span>CF Graph</strong>
        Loading the Python runtime and dashboard…
        <br />
        <small>The first visit downloads Pyodide; later visits are cached by the browser.</small>
      </div>
    </div>

    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";

      const boot = document.getElementById("boot");

      async function loadText(path) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load ${path}: HTTP ${response.status}`);
        }
        return response.text();
      }

      try {
        const [appCode, dataCode] = await Promise.all([
          loadText("./streamlit_app.py"),
          loadText("./stlite_data.py"),
        ]);

        mount(
          {
            entrypoint: "streamlit_app.py",
            files: {
              "streamlit_app.py": appCode,
              "stlite_data.py": dataCode,
            },
            requirements: ["plotly", "pandas", "numpy"],
            streamlitConfig: {
              "theme.base": "light",
              "theme.primaryColor": "#0000FF",
              "theme.backgroundColor": "#f4f6fb",
              "theme.secondaryBackgroundColor": "#ffffff",
              "theme.textColor": "#0f172a",
              "theme.font": "sans serif",
            },
          },
          document.getElementById("root"),
        );
      } catch (error) {
        boot.innerHTML = `
          <div id="boot-card">
            <strong>CF Graph could not start</strong>
            ${String(error)}
            <br /><br />
            Run this page from a local web server, not by double-clicking index.html.
          </div>`;
      }

      const observer = new MutationObserver(() => {
        if (document.querySelector('[data-testid="stApp"]')) {
          boot.remove();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
